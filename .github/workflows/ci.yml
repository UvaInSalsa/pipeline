name: CI - Módulo de descuentos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install pytest pytest-cov
      - name: Ejecutar pruebas y validar cobertura (>= 80%)
        run: pytest -v --cov=descuentos --cov-report=term-missing --cov-report=xml --junitxml=reporte-pruebas.xml --cov-fail-under=80
      - name: Subir reportes como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ci
          path: |
            reporte-pruebas.xml
            coverage.xml
